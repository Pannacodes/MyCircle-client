<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clipA"><circle cx="38" cy="37" r="24"/></clipPath>
    <clipPath id="clipB"><circle cx="60" cy="37" r="24"/></clipPath>
  </defs>

  <!-- base circles -->
  <circle cx="38" cy="37" r="24" fill="#C1622D"/>
  <circle cx="60" cy="37" r="24" fill="#6E8B74"/>
  <circle cx="49" cy="56" r="24" fill="#D9A441"/>

  <!-- pairwise overlaps (multiply-blended, baked in as flat colour) -->
  <g clip-path="url(#clipA)"><circle cx="60" cy="37" r="24" fill="#533514"/></g>
  <g clip-path="url(#clipB)"><circle cx="49" cy="56" r="24" fill="#5E591E"/></g>
  <g clip-path="url(#clipA)"><circle cx="49" cy="56" r="24" fill="#A43F0B"/></g>

  <!-- triple overlap -->
  <g clip-path="url(#clipA)"><g clip-path="url(#clipB)"><circle cx="49" cy="56" r="24" fill="#472205"/></g></g>
</svg>
